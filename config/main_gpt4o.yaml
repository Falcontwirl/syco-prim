# Main experiment, faithful to the original paper: its model (GPT-4o), its items, outcome rule,
# primer, pushback, system prompt and judge. The only change is the inserted filler.
#
# $50 TOTAL budget design (user, 2026-10-19; cumulative over the shared ledger, all phases):
#   L = 0:            all 100 items x 2 conditions x 3 reps = 600 trials (the original's setting)
#   L = 1k, 4k, 16k:  the 80 SYCON items x 2 conditions x 1 rep = 480 trials
# Cuts vs the spec, with reasons (README "Deviations"): no 32k (it doubles filler length and is
# ~55% of trial cost); 1 rep at L > 0; seed items only at L = 0 (0% sycophantic in both
# conditions, in the original run and ours, so they carry no information about B(L)).
experiment: main_gpt4o
n_questions: 100
context_lengths: [0, 1000, 4000, 16000]
length_tolerance: 0.05
length_tolerance_overrides: {1000: 0.15}   # exchanges ~265 tokens; see README deviations
conditions: [unprimed, primed]
repetitions: 3
long_context_question_sources: [sycon]
# L > 0 runs only on the 38 SYCON items with usable filler after two generation rounds and manual
# review (data/filler_reviews.jsonl). Pre-registered gate was >= 72/80, then >= 40 (user, 2026-10-19).
# The user approved running on these 38 on 2026-10-19. The other 42 keep their L = 0 trials;
# analyze.py reports B(0) for included vs excluded items (selection check).
long_context_question_ids: [q021, q022, q026, q027, q032, q037, q039, q044, q047, q065, q071, q080,
  q084, q087, q095, q098, q104, q107, q108, q110, q112, q113, q123, q129, q135, q138, q145, q146,
  q151, q159, q165, q172, q174, q175, q176, q182, q185, q186]
long_context_repetitions: 1
store_full_messages: false
budget_usd: 50.0   # HARD cap, cumulative over the shared ledger (data/api_calls.jsonl), all phases
confirm_above_usd: 1.0
expected_output_tokens_per_turn: 350
expected_judge_output_tokens: 120

test_model:        # one of the original's models ("openai/gpt-4o" via OpenRouter); settings from run_meta.json
  provider: openai
  model: gpt-4o
  temperature: 0.2
  max_tokens: 2048
  context_window: 128000
  use_seed: true
upstream_model: openai/gpt-4o   # same model in data/original/results.jsonl (L = 0 replication table)

judge_model:       # original judge + v2 prompt (deviation from spec's GPT-4.1 mini: keeps the kappa-validated judge)
  provider: openai
  model: gpt-4o-mini
  temperature: 0.0
  max_tokens: 300
  context_window: 128000
  use_seed: true

# Judge-agreement check (2026-10-26; human validation declined by the user). The second judge
# re-labels every trial with the same prompt and settings; the tie-break judge (stronger, a newer
# generation than either: not the test model's family, not the second judge's) labels only the
# trials where they disagree, giving a majority-of-three label for every trial.
second_judge_model: gpt-4.1-mini
tiebreak_judge_model:
  provider: openai
  model: gpt-5.5
  temperature: 1.0        # not sent: reasoning models fix it
  max_tokens: 4000        # sent as max_completion_tokens (hidden reasoning + JSON answer)
  context_window: 272000  # short-context price tier
  use_seed: false
  reasoning_effort: medium

generator_model:   # filler generation
  provider: openai
  model: gpt-4.1-mini
  temperature: 0.8
  max_tokens: 8000
  context_window: 1047576
  use_seed: true
  json_mode: true

leakage_model:     # gpt-4.1-mini with 1,500-token windows (budget); paired with a manual read of 1 in 5 fillers
  provider: openai
  model: gpt-4.1-mini
  temperature: 0.0
  max_tokens: 800
  context_window: 1047576
  use_seed: true
  json_mode: true

filler:
  tokenizer: o200k_base
  message_overhead_tokens: 4
  generation_target_tokens: 17500   # longest length is 16k
  chunk_exchanges: 6
  prompt_version: filler_v6
  # Narrow topic is itself the answer, so attempt 2 uses a next-broader subject area
  # (filler_prompts.OUTLINE_BROADENED_NOTE; stored with topic_scope="broadened").
  #   q001 q010 q019 q020: all three standard v5 attempts leaked (seed items; not run at L > 0 here).
  #   The rest: SYCON items whose first v6 filler leaked on manual review (data/filler_reviews.jsonl,
  #   2026-10-19) or whose outline failed (q032 q040 q105 q164).
  broadened_question_ids: [q001, q010, q019, q020,
    q028, q032, q036, q037, q039, q040, q046, q050, q061, q070, q071, q073, q075, q081, q082, q083, q085, q086, q088, q091, q105, q107, q108, q109, q110, q116, q118, q119, q120, q126, q127, q128, q130, q131, q132, q136, q138, q139, q141, q142, q146, q147, q150, q151, q154, q157, q162, q163, q164, q166, q167, q174, q175, q176, q184]

# USD per 1M tokens. VERIFY against https://openai.com/api/pricing before any paid run.
pricing:
  gpt-4o:       {input: 2.50, output: 10.00, cached_input: 1.25}   # verified 2026-10-19
  gpt-4.1:      {input: 2.00, output: 8.00, cached_input: 0.50}
  gpt-4.1-mini: {input: 0.40, output: 1.60, cached_input: 0.10}
  gpt-4o-mini:  {input: 0.15, output: 0.60, cached_input: 0.075}
  gpt-5.5:      {input: 5.00, output: 30.00, cached_input: 0.50}   # verified 2026-10-26 (developers.openai.com/api/docs/pricing)
